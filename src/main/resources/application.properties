spring.application.name=demo

# --- Variables de entorno: se leen de .env (ver .env.example) si el archivo existe ---
spring.config.import=optional:file:.env[.properties]

# --- Conexion a la base de datos ---
# En local, el modulo spring-boot-docker-compose detecta el compose.yaml y sobreescribe
# estos valores con el puerto real del contenedor. En contenedor/produccion se definen por
# entorno (DB_URL apunta al servicio 'postgres') y se desactiva la integracion docker-compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:horizontal}}
spring.datasource.username=${DB_USER:horizontal}
spring.datasource.password=${DB_PASSWORD:secret}
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}

# --- Pool de conexiones (HikariCP): minimo y maximo para controlar el consumo ---
# maximum-pool-size = tope de conexiones simultaneas a Postgres (evita saturar la BD).
# minimum-idle      = conexiones que se mantienen abiertas en reposo.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# --- Base de datos: el esquema lo crea y migra FLYWAY (db/migration). Hibernate no genera esquema ni SQL ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.data.jdbc.repositories.enabled=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.time-zone=America/Bogota

# --- OAuth2 (servidor de recursos JWT) y refresh token ---
# En produccion define JWT_SECRET (minimo 32 caracteres). El valor por defecto es SOLO para desarrollo.
app.jwt.issuer=torres-del-parque
app.jwt.secret=${JWT_SECRET:dev-only-secreto-cambiar-en-produccion-0123456789}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d

# --- CORS: origen del front-end (Next.js) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Datos iniciales (SOLO desarrollo): se crean una vez si no existen. Cambia la contrasena en produccion ---
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin.identificacion=${SEED_ADMIN_IDENTIFICACION:1000000001}
app.seed.admin.nombre=${SEED_ADMIN_NOMBRE:Administrador del Conjunto}
app.seed.admin.correo=${SEED_ADMIN_CORREO:admin@torresdelparque.com}
app.seed.admin.contrasena=${SEED_ADMIN_CONTRASENA:Admin123!}

# --- Pasarela de pagos (Wompi) ---
# Las 4 llaves y la url-api-rest deben ser del MISMO ambiente (sandbox o produccion).
app.pasarela.nombre=${PASARELA_NOMBRE:Wompi}
# URL del checkout web (a donde se redirige al residente).
app.pasarela.url-api=${PASARELA_URL_API:https://checkout.wompi.co/p/}
# Llave publica (pub_test_... / pub_prod_...): abre el checkout.
app.pasarela.api-key=${PASARELA_API_KEY:pub_test_CAMBIAR_POR_LA_LLAVE_REAL}
# Secreto de integridad (test_integrity_...): firma el checkout (signature:integrity). SECRETO.
app.pasarela.integrity-secret=${PASARELA_INTEGRITY_SECRET:}
# Secreto de eventos (test_events_...): verifica que el webhook lo envia Wompi (signature.checksum). SECRETO.
app.pasarela.events-secret=${PASARELA_EVENTS_SECRET:}
# Llave privada (prv_test_... / prv_prod_...): el back consulta la transaccion en la API antes de aprobar. SECRETO.
app.pasarela.private-key=${PASARELA_PRIVATE_KEY:}
# API REST de Wompi: https://sandbox.wompi.co/v1 (pruebas) o https://production.wompi.co/v1 (produccion).
app.pasarela.url-api-rest=${PASARELA_URL_API_REST:https://sandbox.wompi.co/v1}
# A donde vuelve el residente despues de pagar (pantalla de resultado del front). Opcional.
app.pasarela.redirect-url=${PASARELA_REDIRECT_URL:}
