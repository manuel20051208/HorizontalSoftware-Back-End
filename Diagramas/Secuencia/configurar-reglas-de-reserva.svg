<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="726" viewBox="0 0 1080 726">
<title>Diagrama de secuencia: Configurar reglas de reserva</title>
<defs><marker id="cerrada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="abierta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#000000" stroke-width="1.2"/></marker></defs>
<rect width="1080" height="726" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="start" font-weight="bold"><tspan x="22" y="27">Diagrama de secuencia: Configurar reglas de reserva</tspan></text>
<circle cx="110" cy="68" r="8" fill="#ffcc99" stroke="#36393d" stroke-width="1.2"/><path d="M110,76 V96 M96,84 H124 M110,96 L96,116 M110,96 L124,116" fill="none" stroke="#36393d" stroke-width="1.2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold"><tspan x="110" y="129">Administrador</tspan></text>
<polyline points="110,156 110,666" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="380" y1="100" x2="380" y2="666" stroke="#666666" stroke-dasharray="6 4"/><rect x="305" y="60" width="150" height="40" fill="#cce5ff" stroke="#36393d"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold"><tspan x="380" y="81">:Administrador</tspan></text>
<line x1="650" y1="100" x2="650" y2="666" stroke="#666666" stroke-dasharray="6 4"/><rect x="575" y="60" width="150" height="40" fill="#cce5ff" stroke="#36393d"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold"><tspan x="650" y="81">:ReglaReserva</tspan></text>
<line x1="920" y1="100" x2="920" y2="666" stroke="#666666" stroke-dasharray="6 4"/><rect x="845" y="60" width="150" height="40" fill="#cce5ff" stroke="#36393d"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold"><tspan x="920" y="81">:Rompimiento</tspan></text>
<rect x="345" y="325" width="610" height="116" fill="none" stroke="#36393d"/><path d="M345,347 H390 L400,337 V325" fill="#ffffff" stroke="#36393d"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" font-weight="bold"><tspan x="351" y="338">loop</tspan></text>
<rect x="345" y="469" width="610" height="116" fill="none" stroke="#36393d"/><path d="M345,491 H390 L400,481 V469" fill="#ffffff" stroke="#36393d"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" font-weight="bold"><tspan x="351" y="482">opt</tspan></text>
<rect x="645" y="254" width="10" height="49" fill="#ffffff" stroke="#000000"/>
<rect x="915" y="376" width="10" height="49" fill="#ffffff" stroke="#000000"/>
<rect x="915" y="520" width="10" height="49" fill="#ffffff" stroke="#000000"/>
<rect x="375" y="202" width="10" height="426" fill="#ffffff" stroke="#000000"/>
<polyline points="115,208 375,208" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#cerrada)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="245" y="183">ConfigurarNuevaReglaReserva(inmueble,</tspan><tspan x="245" y="198">adminId)</tspan></text>
<polyline points="385,260 645,260" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#cerrada)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="515" y="235">actualizarReglas(nuevaAnticipacion,</tspan><tspan x="515" y="250">nuevaDuracion)</tspan></text>
<polyline points="645,297 385,297" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#abierta)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="515" y="287">regla actualizada</tspan></text>
<polyline points="385,382 915,382" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#cerrada)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="650" y="372">aplicarRegla()</tspan></text>
<polyline points="915,419 385,419" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#abierta)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="650" y="409">activa = true</tspan></text>
<polyline points="385,526 915,526" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#cerrada)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="650" y="516">inactivarRegla()</tspan></text>
<polyline points="915,563 385,563" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#abierta)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="650" y="553">activa = false</tspan></text>
<polyline points="375,622 115,622" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#abierta)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="245" y="612">regla de reserva configurada</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" font-style="italic"><tspan x="409" y="339">[por cada zona común a la que se aplica la regla]</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" font-style="italic"><tspan x="409" y="483">[retirar la regla de una zona]</tspan></text>
</svg>
