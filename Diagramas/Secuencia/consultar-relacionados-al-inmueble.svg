<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold"><tspan x="380" y="81">:Inmueble</tspan></text>
<line x1="650" y1="100" x2="650" y2="418" stroke="#666666" stroke-dasharray="6 4"/><rect x="575" y="60" width="150" height="40" fill="#cce5ff" stroke="#36393d"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold"><tspan x="650" y="81">:UsuarioAutorizado</tspan></text>
<rect x="75" y="258" width="610" height="116" fill="none" stroke="#36393d"/><path d="M75,280 H120 L130,270 V258" fill="#ffffff" stroke="#36393d"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" font-weight="bold"><tspan x="81" y="271">loop</tspan></text>
<rect x="375" y="187" width="10" height="49" fill="#ffffff" stroke="#000000"/>
<rect x="645" y="309" width="10" height="49" fill="#ffffff" stroke="#000000"/>
<polyline points="115,193 375,193" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#cerrada)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="245" y="183">mostrarUsuarios(List&lt;Usuario&gt;)</tspan></text>
<polyline points="375,230 115,230" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#abierta)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="245" y="220">List&lt;String&gt;</tspan></text>
<polyline points="115,315 645,315" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#cerrada)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="380" y="305">buscarRelacionResidente()</tspan></text>
<polyline points="645,352 115,352" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#abierta)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="380" y="342">List&lt;Residente&gt;</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start" font-style="italic"><tspan x="139" y="272">[por cada usuario autorizado (invitado) del inmueble]</tspan></text>
