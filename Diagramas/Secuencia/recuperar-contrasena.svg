<svg xmlns="http://www.w3.org/2000/svg" width="578" height="380" viewBox="0 0 578 380">
<title>Diagrama de secuencia: Recuperar contraseña</title>
<defs><marker id="cerrada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="abierta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#000000" stroke-width="1.2"/></marker></defs>
<rect width="578" height="380" fill="#ffffff"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="start" font-weight="bold"><tspan x="22" y="27">Diagrama de secuencia: Recuperar contraseña</tspan></text>
<circle cx="110" cy="68" r="8" fill="#ffcc99" stroke="#36393d" stroke-width="1.2"/><path d="M110,76 V96 M96,84 H124 M110,96 L96,116 M110,96 L124,116" fill="none" stroke="#36393d" stroke-width="1.2"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold"><tspan x="110" y="129">Residente,</tspan><tspan x="110" y="144">Vigilante o</tspan><tspan x="110" y="159">Administrador</tspan></text>
<polyline points="110,156 110,320" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="380" y1="100" x2="380" y2="320" stroke="#666666" stroke-dasharray="6 4"/><rect x="305" y="60" width="150" height="40" fill="#cce5ff" stroke="#36393d"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle" font-weight="bold"><tspan x="380" y="81">:Usuario</tspan></text>
<rect x="380" y="215" width="10" height="32" fill="#ffffff" stroke="#000000"/>
<rect x="375" y="187" width="10" height="95" fill="#ffffff" stroke="#000000"/>
<polyline points="115,193 375,193" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#cerrada)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="245" y="183">recuperarContrasena()</tspan></text>
<polyline points="390,219 428,219 428,243 390,243" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#cerrada)"/>
<polyline points="375,276 115,276" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#abierta)"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle"><tspan x="245" y="266">confirmación de envío</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000" text-anchor="start"><tspan x="436" y="228">cerrarSesion()</tspan></text>
</svg>
